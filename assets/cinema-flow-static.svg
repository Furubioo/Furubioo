<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
  <title id="title">Cinema: duas implementações acadêmicas</title>
  <desc id="desc">Diagrama esquemático. À esquerda, a versão Java de terminal: CinemaView, CinemaController, Usuario e suas estratégias de preço, Sessao e Bilhete, e persistência em filmes.txt e usuarios.txt. À direita, a versão Web: páginas React, cliente Axios, controlador SessaoController, SessaoRepository e banco H2. Todo o conteúdo está visível sem animação.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131a"/>
      <stop offset="1" stop-color="#102f3c"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#b5e4f3" stroke-opacity=".045"/>
    </pattern>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8fd3ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#8fd3ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#8fd3ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1120" height="660" rx="24" fill="url(#bg)"/>
  <rect width="1120" height="660" rx="24" fill="url(#grid)"/>
  <text x="40" y="40" fill="#7ee8c1" font-family="ui-monospace,monospace" font-size="14" font-weight="700" letter-spacing="2">PROJETO ACADÊMICO · POO · UNICAP</text>
  <text x="40" y="78" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="34" font-weight="700">Sistema de Cinema</text>
  <text x="40" y="101" fill="#a8c1cb" font-family="Arial,sans-serif" font-size="16">Duas implementações independentes; diagramas esquemáticos baseados no código.</text>

  <rect x="28" y="124" width="520" height="492" rx="18" fill="#081920" stroke="#365867"/>
  <text x="52" y="157" fill="#8fd3ff" font-family="ui-monospace,monospace" font-size="13" font-weight="700" letter-spacing="1.5">01 · CINEMA-CONSOLE</text>
  <text x="52" y="184" fill="#eef6f9" font-family="Arial,sans-serif" font-size="22" font-weight="700">Terminal · Java</text>
  <text x="52" y="204" fill="#8aa8b4" font-family="ui-monospace,monospace" font-size="13">MVC · dominio · persistência em arquivos</text>

  <path d="M288 252V278M288 328V354M288 435V461M288 511V537" fill="none" stroke="#3f7f95" stroke-width="2"/>
  <path d="M284 273l4 6 4-6M284 349l4 6 4-6M284 456l4 6 4-6M284 532l4 6 4-6" fill="#8fd3ff"/>

  <rect x="52" y="220" width="472" height="52" rx="10" fill="#112733" stroke="#335767"/>
  <text x="68" y="242" fill="#eef6f9" font-family="Arial,sans-serif" font-size="16" font-weight="700">CinemaView · Terminal</text>
  <text x="68" y="259" fill="#8aa8b4" font-family="ui-monospace,monospace" font-size="13">entrada e apresentação</text>

  <rect x="52" y="280" width="472" height="48" rx="10" fill="#112733" stroke="#335767"/>
  <text x="68" y="310" fill="#eef6f9" font-family="Arial,sans-serif" font-size="16" font-weight="700">CinemaController</text>
  <text x="508" y="310" text-anchor="end" fill="#8aa8b4" font-family="ui-monospace,monospace" font-size="13">coordena a compra</text>

  <rect x="52" y="356" width="472" height="79" rx="10" fill="#112733" stroke="#335767"/>
  <text x="68" y="378" fill="#eef6f9" font-family="Arial,sans-serif" font-size="16" font-weight="700">Usuario → EstrategiaPreco</text>
  <text x="68" y="396" fill="#8aa8b4" font-family="ui-monospace,monospace" font-size="13">calcularPrecoFinal(precoBase)</text>
  <text x="68" y="419" fill="#a8c1cb" font-family="ui-monospace,monospace" font-size="12">Comum · preço-base</text>
  <text x="228" y="419" fill="#a8c1cb" font-family="ui-monospace,monospace" font-size="12">Crítico · R$ 0</text>
  <text x="362" y="419" fill="#a8c1cb" font-family="ui-monospace,monospace" font-size="12">Estudante · metade</text>

  <rect x="52" y="463" width="472" height="48" rx="10" fill="#112733" stroke="#335767"/>
  <text x="68" y="493" fill="#eef6f9" font-family="Arial,sans-serif" font-size="16" font-weight="700">Sessao · Sala · Bilhete</text>
  <text x="508" y="493" text-anchor="end" fill="#8aa8b4" font-family="ui-monospace,monospace" font-size="13">valida e ocupa a cadeira</text>

  <rect x="52" y="539" width="472" height="52" rx="10" fill="#102a2b" stroke="#3b7568"/>
  <text x="68" y="562" fill="#7ee8c1" font-family="Arial,sans-serif" font-size="16" font-weight="700">PersistenciaArquivo</text>
  <text x="68" y="579" fill="#a8c1cb" font-family="ui-monospace,monospace" font-size="13">filmes.txt · usuarios.txt</text>

  <rect x="572" y="124" width="520" height="492" rx="18" fill="#081920" stroke="#365867"/>
  <text x="596" y="157" fill="#7ee8c1" font-family="ui-monospace,monospace" font-size="13" font-weight="700" letter-spacing="1.5">02 · CINEMA-SYSTEM</text>
  <text x="596" y="184" fill="#eef6f9" font-family="Arial,sans-serif" font-size="22" font-weight="700">Web · React + Vite · Spring Boot</text>
  <text x="596" y="204" fill="#8aa8b4" font-family="ui-monospace,monospace" font-size="13">front-end e back-end em aplicações separadas</text>

  <path d="M832 252V278M832 328V354M832 404V430M832 480V506" fill="none" stroke="#3f7f95" stroke-width="2"/>
  <path d="M828 273l4 6 4-6M828 349l4 6 4-6M828 425l4 6 4-6M828 501l4 6 4-6" fill="#8fd3ff"/>

  <rect x="596" y="220" width="472" height="52" rx="10" fill="#112733" stroke="#335767"/>
  <text x="612" y="242" fill="#eef6f9" font-family="Arial,sans-serif" font-size="16" font-weight="700">ProgramacaoPage → CompraPage</text>
  <text x="612" y="259" fill="#8aa8b4" font-family="ui-monospace,monospace" font-size="13">React · seleção de sessão e compra</text>

  <rect x="596" y="280" width="472" height="48" rx="10" fill="#112733" stroke="#335767"/>
  <text x="612" y="310" fill="#eef6f9" font-family="Arial,sans-serif" font-size="16" font-weight="700">Axios · src/api/api.js</text>
  <text x="1052" y="310" text-anchor="end" fill="#8aa8b4" font-family="ui-monospace,monospace" font-size="13">HTTP · localhost:8080</text>

  <rect x="596" y="356" width="472" height="48" rx="10" fill="#112733" stroke="#335767"/>
  <text x="612" y="386" fill="#eef6f9" font-family="Arial,sans-serif" font-size="16" font-weight="700">SessaoController</text>
  <text x="1052" y="386" text-anchor="end" fill="#8aa8b4" font-family="ui-monospace,monospace" font-size="13">POST /sessoes/{id}/comprar</text>

  <rect x="596" y="432" width="472" height="48" rx="10" fill="#112733" stroke="#335767"/>
  <text x="612" y="462" fill="#eef6f9" font-family="Arial,sans-serif" font-size="16" font-weight="700">SessaoRepository · Spring Data JPA</text>

  <rect x="596" y="508" width="472" height="52" rx="10" fill="#102a2b" stroke="#3b7568"/>
  <text x="612" y="531" fill="#7ee8c1" font-family="Arial,sans-serif" font-size="16" font-weight="700">Banco H2</text>
  <text x="612" y="548" fill="#a8c1cb" font-family="ui-monospace,monospace" font-size="13">persistência local · cinema.backend</text>

  <text x="832" y="584" text-anchor="middle" fill="#8aa8b4" font-family="ui-monospace,monospace" font-size="12">o controlador valida a cadeira, salva a sessão e monta o bilhete</text>
  <rect x="1" y="1" width="1118" height="658" rx="23" fill="none" stroke="url(#edge)"/>
</svg>
