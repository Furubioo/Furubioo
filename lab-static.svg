name: Update profile activity calendar

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-activity-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate contribution calendar
        run: python3 scripts/visuals/build.py --only activity

      - name: Commit updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-activity*.svg
          if git diff --cached --quiet; then
            echo "Contribution calendar is already up to date."
            exit 0
          fi
          git commit -m "chore: refresh public contribution calendar"
          git push
