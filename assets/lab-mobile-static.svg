<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1190" role="img" aria-labelledby="title desc">
  <title id="title">Três estudos do acervo acadêmico</title>
  <desc id="desc">Diagrama vertical esquemático: tokens e árvore de um compilador C simplificado; três LEDs, três botões e dois LEDs de feedback do jogo Raspberry Pi; estado possível do algoritmo de Peterson com T0 na seção crítica e T1 aguardando. Conteúdo completo sem animação.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07131a"/><stop offset="1" stop-color="#102f3c"/></linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#b5e4f3" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="400" height="1190" rx="20" fill="url(#bg)"/><rect width="400" height="1190" rx="20" fill="url(#grid)"/>
  <text x="22" y="34" fill="#7ee8c1" font-family="ui-monospace,monospace" font-size="9" font-weight="700" letter-spacing="1.4">ACERVO ACADÊMICO · ESTUDOS EM CÓDIGO</text>
  <text x="22" y="64" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="21" font-weight="700">Do código ao hardware</text>
  <text x="22" y="84" fill="#a8c1cb" font-family="Arial,sans-serif" font-size="12">e à concorrência · diagramas esquemáticos</text>

  <rect x="16" y="104" width="368" height="326" rx="15" fill="#081920" stroke="#365867"/>
  <text x="34" y="132" fill="#7d9ba7" font-family="ui-monospace,monospace" font-size="9">construcao-compiladores/</text>
  <text x="34" y="157" fill="#eef6f9" font-family="Arial,sans-serif" font-size="16" font-weight="700">Lexer → parser → AST</text>
  <text x="34" y="185" fill="#d7e7ec" font-family="ui-monospace,monospace" font-size="13">total = a + 2;</text>
  <g font-family="ui-monospace,monospace" font-size="9" font-weight="700">
    <rect x="34" y="198" width="58" height="23" rx="6" fill="#123241" stroke="#8fd3ff"/><text x="63" y="213" text-anchor="middle" fill="#8fd3ff">IDENT</text>
    <rect x="98" y="198" width="32" height="23" rx="6" fill="#12342f" stroke="#7ee8c1"/><text x="114" y="213" text-anchor="middle" fill="#7ee8c1">=</text>
    <rect x="136" y="198" width="48" height="23" rx="6" fill="#123241" stroke="#8fd3ff"/><text x="160" y="213" text-anchor="middle" fill="#8fd3ff">IDENT</text>
    <rect x="190" y="198" width="32" height="23" rx="6" fill="#12342f" stroke="#7ee8c1"/><text x="206" y="213" text-anchor="middle" fill="#7ee8c1">+</text>
    <rect x="228" y="198" width="58" height="23" rx="6" fill="#3a3014" stroke="#f0c674"/><text x="257" y="213" text-anchor="middle" fill="#f0c674">INTEGER</text>
    <rect x="292" y="198" width="32" height="23" rx="6" fill="#16262e" stroke="#7d9ba7"/><text x="308" y="213" text-anchor="middle" fill="#a8c1cb">;</text>
  </g>
  <text x="34" y="246" fill="#7d9ba7" font-family="ui-monospace,monospace" font-size="9" letter-spacing="1">ÁRVORE SINTÁTICA · ESQUEMA</text>
  <path d="M200 270L117 308M200 270L283 308M283 326L241 362M283 326L325 362" fill="none" stroke="#45869b" stroke-width="1.5"/>
  <circle cx="200" cy="270" r="14" fill="#12342f" stroke="#7ee8c1"/><text x="200" y="274" text-anchor="middle" fill="#7ee8c1" font-family="ui-monospace,monospace" font-size="11" font-weight="700">=</text>
  <rect x="91" y="296" width="52" height="24" rx="7" fill="#123241" stroke="#8fd3ff"/><text x="117" y="312" text-anchor="middle" fill="#8fd3ff" font-family="ui-monospace,monospace" font-size="10">total</text>
  <circle cx="283" cy="308" r="14" fill="#12342f" stroke="#7ee8c1"/><text x="283" y="312" text-anchor="middle" fill="#7ee8c1" font-family="ui-monospace,monospace" font-size="11" font-weight="700">+</text>
  <circle cx="241" cy="362" r="13" fill="#123241" stroke="#8fd3ff"/><text x="241" y="366" text-anchor="middle" fill="#8fd3ff" font-family="ui-monospace,monospace" font-size="10">a</text>
  <circle cx="325" cy="362" r="13" fill="#3a3014" stroke="#f0c674"/><text x="325" y="366" text-anchor="middle" fill="#f0c674" font-family="ui-monospace,monospace" font-size="10">2</text>
  <text x="34" y="408" fill="#a8c1cb" font-family="ui-monospace,monospace" font-size="9">tokens → análise sintática</text>

  <rect x="16" y="450" width="368" height="320" rx="15" fill="#081920" stroke="#365867"/>
  <text x="34" y="478" fill="#7d9ba7" font-family="ui-monospace,monospace" font-size="9">fundamentos-hardware/</text>
  <text x="34" y="503" fill="#eef6f9" font-family="Arial,sans-serif" font-size="16" font-weight="700">Jogo de memória · Raspberry Pi</text>
  <text x="34" y="524" fill="#8aa8b4" font-family="ui-monospace,monospace" font-size="9">3 cores em sequência → 3 respostas</text>
  <rect x="34" y="541" width="332" height="150" rx="12" fill="#0d241f" stroke="#2f6b5a"/>
  <text x="48" y="562" fill="#7ee8c1" font-family="ui-monospace,monospace" font-size="8" font-weight="700">LED · SAÍDA</text>
  <text x="222" y="562" fill="#8fd3ff" font-family="ui-monospace,monospace" font-size="8" font-weight="700">BOTÃO · ENTRADA</text>
  <path d="M95 589H245M95 622H245M95 655H245" stroke="#3b7568" stroke-width="1.5"/>
  <circle cx="61" cy="589" r="9" fill="#ff8f8f"/><text x="78" y="592" fill="#eaf4f7" font-family="ui-monospace,monospace" font-size="8">GPIO 18</text>
  <circle cx="61" cy="622" r="9" fill="#f0c674"/><text x="78" y="625" fill="#eaf4f7" font-family="ui-monospace,monospace" font-size="8">GPIO 23</text>
  <circle cx="61" cy="655" r="9" fill="#8fd3ff"/><text x="78" y="658" fill="#eaf4f7" font-family="ui-monospace,monospace" font-size="8">GPIO 24</text>
  <circle cx="263" cy="589" r="8" fill="#0a1b17" stroke="#ff8f8f" stroke-width="2"/><text x="279" y="592" fill="#a8c1cb" font-family="ui-monospace,monospace" font-size="8">GPIO 27</text>
  <circle cx="263" cy="622" r="8" fill="#0a1b17" stroke="#f0c674" stroke-width="2"/><text x="279" y="625" fill="#a8c1cb" font-family="ui-monospace,monospace" font-size="8">GPIO 17</text>
  <circle cx="263" cy="655" r="8" fill="#0a1b17" stroke="#8fd3ff" stroke-width="2"/><text x="279" y="658" fill="#a8c1cb" font-family="ui-monospace,monospace" font-size="8">GPIO 22</text>
  <text x="48" y="678" fill="#8aa8b4" font-family="ui-monospace,monospace" font-size="8">feedback: certo 15 · errado 14</text>
  <text x="34" y="718" fill="#a8c1cb" font-family="ui-monospace,monospace" font-size="9">Mostra cada LED e confere a resposta.</text>
  <text x="34" y="738" fill="#7d9ba7" font-family="ui-monospace,monospace" font-size="8">pinos conforme jogo-memoria-rpi.py</text>

  <rect x="16" y="790" width="368" height="368" rx="15" fill="#081920" stroke="#365867"/>
  <text x="34" y="818" fill="#7d9ba7" font-family="ui-monospace,monospace" font-size="9">infraestrutura-software/</text>
  <text x="34" y="843" fill="#eef6f9" font-family="Arial,sans-serif" font-size="16" font-weight="700">Peterson · exclusão mútua</text>
  <text x="34" y="870" fill="#a8c1cb" font-family="ui-monospace,monospace" font-size="9">estado possível · wants[0] = wants[1] = true</text>
  <rect x="34" y="883" width="332" height="32" rx="8" fill="#0c1f29" stroke="#335767"/>
  <text x="48" y="904" fill="#a8c1cb" font-family="ui-monospace,monospace" font-size="10">turn = 0</text>
  <path d="M66 965H269M66 1031H269" stroke="#29434d" stroke-width="1.5" stroke-dasharray="4 5"/>
  <rect x="270" y="939" width="82" height="116" rx="11" fill="#0c1f29" stroke="#7ee8c1" stroke-width="1.5"/>
  <text x="311" y="989" text-anchor="middle" fill="#7ee8c1" font-family="Arial,sans-serif" font-size="11" font-weight="700">seção</text>
  <text x="311" y="1005" text-anchor="middle" fill="#7ee8c1" font-family="Arial,sans-serif" font-size="11" font-weight="700">crítica</text>
  <circle cx="83" cy="965" r="15" fill="#12342f" stroke="#7ee8c1" stroke-width="2"/>
  <text x="83" y="969" text-anchor="middle" fill="#7ee8c1" font-family="ui-monospace,monospace" font-size="10" font-weight="700">T0</text>
  <text x="109" y="969" fill="#a8c1cb" font-family="ui-monospace,monospace" font-size="9">dentro</text>
  <circle cx="83" cy="1031" r="15" fill="#123241" stroke="#8fd3ff" stroke-width="2"/>
  <text x="83" y="1035" text-anchor="middle" fill="#8fd3ff" font-family="ui-monospace,monospace" font-size="10" font-weight="700">T1</text>
  <text x="109" y="1027" fill="#f0c674" font-family="ui-monospace,monospace" font-size="9">aguarda</text>
  <text x="109" y="1041" fill="#8aa8b4" font-family="ui-monospace,monospace" font-size="8">sched_yield()</text>
  <text x="34" y="1084" fill="#a8c1cb" font-family="ui-monospace,monospace" font-size="9">T1 espera enquanto a vez é de T0.</text>
  <text x="34" y="1104" fill="#7d9ba7" font-family="ui-monospace,monospace" font-size="8">enter() / leave() · atomicidade sequencial</text>
  <text x="200" y="1140" text-anchor="middle" fill="#7d9ba7" font-family="ui-monospace,monospace" font-size="8">diagramas esquemáticos · acervo acadêmico</text>
</svg>
