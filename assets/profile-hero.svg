<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Flávio Daniel — código, sistemas e hardware</title>
  <desc id="description">Banner animado com uma janela de terminal conectada a uma rede de circuitos e nós pulsantes, representando os interesses em programação, infraestrutura e hardware.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1921"/>
      <stop offset="1" stop-color="#163541"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fd3ff" stop-opacity="0.05"/>
      <stop offset="0.55" stop-color="#8fd3ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7ee8c1" stop-opacity="0.04"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#b5e4f3" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <style>
    @media (prefers-reduced-motion: reduce) {
      .motion { display: none; }
    }
  </style>

  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="26" fill="url(#grid)"/>
  <ellipse cx="870" cy="180" rx="390" ry="240" fill="url(#glow)"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="62" y="66" fill="#7ee8c1" font-size="13" font-weight="700" letter-spacing="3">ESTUDOS · SISTEMAS · CÓDIGO</text>
    <text x="62" y="126" fill="#f1f7fa" font-size="38" font-weight="700">Entender. Construir.</text>
    <text x="62" y="174" fill="#f1f7fa" font-size="38" font-weight="700">Investigar por dentro.</text>
    <text x="64" y="210" fill="#a8c1cb" font-size="16">Ciência da Computação · UNICAP</text>
    <text x="64" y="235" fill="#a8c1cb" font-size="16">Redes · infraestrutura · hardware · algoritmos</text>
  </g>

  <g transform="translate(64 275)" font-family="Consolas, monospace" font-size="12" font-weight="700">
    <rect x="0" y="0" width="54" height="25" rx="12.5" fill="#173e4d" stroke="#3c7083"/>
    <text x="27" y="17" text-anchor="middle" fill="#8fd3ff">C</text>
    <rect x="64" y="0" width="76" height="25" rx="12.5" fill="#173e4d" stroke="#3c7083"/>
    <text x="102" y="17" text-anchor="middle" fill="#8fd3ff">PYTHON</text>
    <rect x="150" y="0" width="66" height="25" rx="12.5" fill="#173e4d" stroke="#3c7083"/>
    <text x="183" y="17" text-anchor="middle" fill="#8fd3ff">JAVA</text>
    <rect x="226" y="0" width="98" height="25" rx="12.5" fill="#1a443e" stroke="#3c786b"/>
    <text x="275" y="17" text-anchor="middle" fill="#7ee8c1">HARDWARE</text>
  </g>

  <g transform="translate(590 48)">
    <rect x="0" y="0" width="548" height="264" rx="18" fill="#0a151b" stroke="#365867" stroke-width="1.5"/>
    <path d="M0 48H548" stroke="#29434d"/>
    <circle cx="25" cy="24" r="5" fill="#ff7d88"/>
    <circle cx="43" cy="24" r="5" fill="#ffc76b"/>
    <circle cx="61" cy="24" r="5" fill="#7ee8c1"/>
    <text x="84" y="29" fill="#7d9ba7" font-family="Consolas, monospace" font-size="12">flavio@estudos: ~</text>

    <g font-family="Consolas, monospace" font-size="14">
      <text x="28" y="85" fill="#7ee8c1">$</text>
      <text x="46" y="85" fill="#d7e7ec">explorando sistemas</text>
      <text x="28" y="119" fill="#8fd3ff">→</text>
      <text x="48" y="119" fill="#a8c1cb">redes, processos, memória</text>
      <text x="28" y="153" fill="#8fd3ff">→</text>
      <text x="48" y="153" fill="#a8c1cb">estruturas, algoritmos, dados</text>
      <text x="28" y="187" fill="#8fd3ff">→</text>
      <text x="48" y="187" fill="#a8c1cb">código em execução no hardware</text>
      <rect x="28" y="208" width="9" height="17" rx="1" fill="#7ee8c1">
        <animate class="motion" attributeName="opacity" values="1;0.15;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g fill="none" stroke="#45869b" stroke-width="1.5" opacity="0.9">
      <path d="M438 79h42v35h34"/>
      <path d="M438 148h28v-18h48"/>
      <path d="M438 207h46v-28h30"/>
      <path d="M470 79v-20h38"/>
      <circle cx="480" cy="114" r="3" fill="#8fd3ff"/>
      <circle cx="514" cy="130" r="3" fill="#7ee8c1"/>
      <circle cx="484" cy="179" r="3" fill="#8fd3ff"/>
      <circle cx="508" cy="59" r="3" fill="#7ee8c1"/>
    </g>

    <circle cx="480" cy="114" r="5" fill="#8fd3ff" opacity="0.35" filter="url(#soft-glow)">
      <animate class="motion" attributeName="r" values="5;12;5" dur="3.2s" repeatCount="indefinite"/>
      <animate class="motion" attributeName="opacity" values="0.45;0.08;0.45" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="514" cy="130" r="5" fill="#7ee8c1" opacity="0.4">
      <animate class="motion" attributeName="r" values="4;9;4" dur="2.6s" begin="0.8s" repeatCount="indefinite"/>
      <animate class="motion" attributeName="opacity" values="0.7;0.18;0.7" dur="2.6s" begin="0.8s" repeatCount="indefinite"/>
    </circle>

    <path d="M28 242H518" stroke="#243c45"/>
    <circle cx="34" cy="253" r="3.5" fill="#7ee8c1">
      <animate class="motion" attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="46" y="258" fill="#7d9ba7" font-family="Consolas, monospace" font-size="11">curiosidade em execução</text>
    <text x="514" y="258" text-anchor="end" fill="#52717c" font-family="Consolas, monospace" font-size="10">READY</text>
  </g>
</svg>
