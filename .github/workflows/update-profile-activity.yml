name: Update profile activity calendar

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-activity-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate contribution calendars
        run: python3 scripts/generate_profile_visuals.py --only activities

      - name: Commit updated calendars
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-activity.svg assets/github-activity-dark.svg
          if git diff --cached --quiet; then
            echo "Contribution calendars are already up to date."
            exit 0
          fi
          git commit -m "chore: refresh public contribution calendar"
          git push
