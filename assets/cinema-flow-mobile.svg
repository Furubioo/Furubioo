<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1520" role="img" aria-labelledby="title desc">
  <title id="title">Sistema de Cinema · fluxo de compra</title>
  <desc id="desc">Versão vertical para celular. Mostra as estratégias reais de preço do terminal e, na Web, POST /sessoes/{id}/comprar em localhost:8080, com requisição circular e resposta quadrada em trilha tracejada.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131a"/><stop offset="1" stop-color="#102f3c"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8fd3ff"/></marker>
    <marker id="arrow-response" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#ffe09a"/></marker>
  </defs>
  <rect width="400" height="1520" rx="20" fill="url(#bg)"/>
  <text x="20" y="42" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="22" font-weight="700">Sistema de Cinema</text>
  <g data-panel="terminal">
    <rect class="panel-card" x="16" y="68" width="368" height="660" rx="16" fill="#0c1f29" stroke="#7ee8c1" stroke-width="3"/>
    <text x="34" y="105" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="17" font-weight="700">Terminal · Java</text>
    <path d="M200 185V226M200 286V306M200 536V568M200 628V657" fill="none" stroke="#8fd3ff" stroke-width="2" marker-end="url(#arrow)"/>
    <rect class="node" x="34" y="132" width="332" height="53" rx="10" fill="#102a36" stroke="#52717d" stroke-width="2"/>
    <text x="52" y="165" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="13" font-weight="700">CinemaView</text>
    <rect class="node" x="34" y="226" width="332" height="60" rx="10" fill="#102a36" stroke="#52717d" stroke-width="2"/>
    <text x="52" y="263" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="13" font-weight="700">CinemaController</text>
    <rect class="node" x="34" y="306" width="332" height="230" rx="10" fill="#102a36" stroke="#52717d" stroke-width="2"/>
    <text x="52" y="337" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="13" font-weight="700">Usuario → EstrategiaPreco</text>
    <g class="strategy-option">
      <rect id="strategy-common" x="52" y="356" width="296" height="48" rx="8" fill="#0c1f29" stroke="#52717d" stroke-width="2"/>
      <text x="68" y="386" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="13">PrecoComum · preço-base</text>
    </g>
    <g class="strategy-option">
      <rect id="strategy-critical" x="52" y="416" width="296" height="48" rx="8" fill="#0c1f29" stroke="#52717d" stroke-width="2"/>
      <text x="68" y="446" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="13">PrecoCritico · R$ 0</text>
    </g>
    <g class="strategy-option">
      <rect id="strategy-student" x="52" y="476" width="296" height="48" rx="8" fill="#0c1f29" stroke="#52717d" stroke-width="2"/>
      <text x="68" y="506" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="13">PrecoEstudante · metade</text>
    </g>
    <rect class="node" x="34" y="568" width="332" height="60" rx="10" fill="#102a36" stroke="#52717d" stroke-width="2"/>
    <text x="52" y="605" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="13" font-weight="700">Sessao · Sala · Bilhete</text>
    <rect class="node" x="34" y="657" width="332" height="52" rx="10" fill="#102a2b" stroke="#52717d" stroke-width="2"/>
    <text x="52" y="690" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="13" font-weight="700">PersistenciaArquivo · .txt</text>
    <path id="console-route" d="M200 158V256V337H110V440H200H290H200V598V683" fill="none"/>
    <circle class="console-token" cx="200" cy="158" r="9" fill="#7ee8c1" stroke="#f4f9fb" stroke-width="2" opacity="0"/>
  </g>
  <g data-panel="web">
    <rect class="panel-card" x="16" y="748" width="368" height="742" rx="16" fill="#0c1f29" stroke="#52717d" stroke-width="2"/>
    <text x="34" y="785" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="17" font-weight="700">Web · React + Vite + Spring Boot</text>
    <text x="34" y="815" fill="#c2d3da" font-family="Arial,sans-serif" font-size="13">● requisição   ■ resposta tracejada</text>
    <path d="M334 857V1350" fill="none" stroke="#8fd3ff" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M359 1350V857" fill="none" stroke="#ffe09a" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-response)"/>
    <g fill="#102a36" stroke="#52717d" stroke-width="2">
      <rect class="node" x="34" y="839" width="332" height="54" rx="10"/>
      <rect class="node" x="34" y="929" width="332" height="54" rx="10"/>
      <rect class="node" x="34" y="1019" width="332" height="54" rx="10"/>
      <rect class="node" x="34" y="1109" width="332" height="54" rx="10"/>
      <rect class="node" x="34" y="1199" width="332" height="54" rx="10"/>
    </g>
    <rect class="node" x="34" y="1289" width="332" height="54" rx="10" fill="#102a2b" stroke="#52717d" stroke-width="2"/>
    <g fill="#f4f9fb" font-family="Arial,sans-serif" font-size="13" font-weight="700">
      <text x="52" y="873">ProgramacaoPage → CompraPage</text>
      <text x="52" y="963">Axios · localhost:8080</text>
      <text x="52" y="1053">POST /sessoes/{id}/comprar</text>
      <text x="52" y="1143">SessaoController</text>
      <text x="52" y="1233">SessaoRepository · Spring Data JPA</text>
      <text x="52" y="1323">Banco H2</text>
    </g>
    <circle class="request-token" cx="334" cy="866" r="9" fill="#8fd3ff" stroke="#f4f9fb" stroke-width="2" opacity="0"/>
    <rect class="response-token" x="352" y="1343" width="14" height="14" rx="2" fill="#ffe09a" stroke="#07131a" stroke-width="1.5" opacity="0"/>
  </g>
<g aria-hidden="true"><circle r="8" fill="#7ee8c1" stroke="#f4f9fb" stroke-width="3" aria-hidden="true">
  <animateMotion path="M200 158 V256 H360 V544 H200 V598 V683" dur="18s" begin="0s" keyPoints="0;1;1" keyTimes="0;.76;1" calcMode="linear" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.76;.84;.96;1" dur="18s" begin="0s" repeatCount="indefinite"/>
</circle>
<circle class="request-token" cx="334" cy="866" r="8" fill="#8fd3ff" stroke="#f4f9fb" stroke-width="3"><animateMotion path="M0 0 V484" dur="18s" keyPoints="0;0;1;1;1" keyTimes="0;.02;.72;.76;1" calcMode="linear" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;1;0;0" keyTimes="0;.72;.76;.8;1" dur="18s" repeatCount="indefinite"/></circle>
<rect class="response-token" x="352" y="1343" width="16" height="16" rx="3" fill="#ffe09a" stroke="#07131a" stroke-width="2"><animateMotion path="M0 0 V-484" dur="18s" keyPoints="0;0;1;1;1" keyTimes="0;.48;.78;.82;1" calcMode="linear" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.48;.52;.78;.82;1" dur="18s" repeatCount="indefinite"/></rect>
<animate href="#strategy-common" attributeName="stroke-width" values="2;2;4;4;2;2" keyTimes="0;.39;.40;.43;.44;1" dur="18s" begin="0s" repeatCount="indefinite"/>
<animate href="#strategy-critical" attributeName="stroke-width" values="2;2;4;4;2;2" keyTimes="0;.50;.51;.54;.55;1" dur="18s" begin="0s" repeatCount="indefinite"/>
<animate href="#strategy-student" attributeName="stroke-width" values="2;2;4;4;2;2" keyTimes="0;.62;.63;.66;.67;1" dur="18s" begin="0s" repeatCount="indefinite"/></g>
</svg>
