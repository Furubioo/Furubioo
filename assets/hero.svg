<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" role="img" aria-labelledby="title desc">
  <title id="title">Flávio Daniel · desenvolvimento, dados e interesse em IA</title>
  <desc id="desc">Desenvolvimento e dados são apresentados com exemplos de projetos preenchidos. IA aparece somente como interesse, em chip com contorno tracejado. Fluxos completos e estáticos: UI, HTTP, API, JPA, H2; variáveis categóricas, pré-processamento e notebook.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131a"/><stop offset="1" stop-color="#102f3c"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#b5e4f3" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="1440" height="600" rx="24" fill="url(#bg)"/>
  <rect width="1440" height="600" rx="24" fill="url(#grid)"/>
  <g data-panel="identity">
    <rect class="panel-card" x="40" y="40" width="410" height="520" rx="20" fill="#0c1f29" stroke="#31515e" stroke-width="2"/>
    <text x="70" y="112" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="42" font-weight="700">Flávio Daniel</text>
    <text x="70" y="166" fill="#c2d3da" font-family="Arial,sans-serif" font-size="22">Ciência da Computação · UNICAP</text>
    <text x="70" y="205" fill="#c2d3da" font-family="Arial,sans-serif" font-size="22">Técnico em Redes de Computadores</text>
    <path d="M70 230H420" stroke="#52717d" stroke-width="2"/>
    <text x="70" y="276" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="22" font-weight="700">Interesses</text>
    <rect id="chip-development" x="70" y="300" width="220" height="58" rx="14" fill="#153a34" stroke="#7ee8c1" stroke-width="3"/>
    <text x="180" y="337" text-anchor="middle" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="22" font-weight="700">Desenvolvimento</text>
    <rect id="chip-data" x="308" y="300" width="112" height="58" rx="14" fill="#153244" stroke="#8fd3ff" stroke-width="2"/>
    <text x="364" y="337" text-anchor="middle" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="22" font-weight="700">Dados</text>
    <rect x="70" y="376" width="250" height="58" rx="14" fill="#0c1f29" stroke="#ffe09a" stroke-width="2" stroke-dasharray="8 7"/>
    <text x="195" y="413" text-anchor="middle" fill="#fff2c2" font-family="Arial,sans-serif" font-size="22" font-weight="700">IA · interesse</text>
    <text x="70" y="485" fill="#c2d3da" font-family="Arial,sans-serif" font-size="22">Redes: base técnica.</text>
  </g>
  <g data-panel="development">
    <rect id="development-card" class="panel-card" x="490" y="40" width="910" height="245" rx="20" fill="#0c1f29" stroke="#7ee8c1" stroke-width="3"/>
    <text x="520" y="88" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="22" font-weight="700">01 · DESENVOLVIMENTO · Sistema de Cinema Web</text>
    <path d="M610 183H1290" stroke="#52717d" stroke-width="3"/>
    <g fill="#102a36" stroke="#52717d" stroke-width="2">
      <rect x="540" y="145" width="140" height="76" rx="12"/>
      <rect x="710" y="145" width="140" height="76" rx="12"/>
      <rect x="880" y="145" width="140" height="76" rx="12"/>
      <rect x="1050" y="145" width="140" height="76" rx="12"/>
      <rect x="1220" y="145" width="140" height="76" rx="12"/>
    </g>
    <g fill="#f4f9fb" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">
      <text x="610" y="192">UI</text><text x="780" y="192">HTTP</text><text x="950" y="192">API</text><text x="1120" y="192">JPA</text><text x="1290" y="192">H2</text>
    </g>
    <g fill="#c2d3da" font-family="Arial,sans-serif" font-size="22" text-anchor="middle">
      <text x="610" y="258">React</text><text x="780" y="258">Axios</text><text x="950" y="258">Spring</text><text x="1120" y="258">JPA</text><text x="1290" y="258">H2</text>
    </g>
  </g>
  <g data-panel="data">
    <rect id="data-card" class="panel-card" x="490" y="315" width="910" height="245" rx="20" fill="#0c1f29" stroke="#52717d" stroke-width="2"/>
    <text x="520" y="363" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="22" font-weight="700">02 · DADOS · estudo acadêmico de score de crédito</text>
    <path d="M670 458H1240" stroke="#52717d" stroke-width="3"/>
    <g fill="#102a36" stroke="#52717d" stroke-width="2">
      <rect x="550" y="420" width="240" height="76" rx="12"/>
      <rect x="820" y="420" width="300" height="76" rx="12"/>
      <rect x="1150" y="420" width="180" height="76" rx="12"/>
    </g>
    <g fill="#f4f9fb" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">
      <text x="670" y="467">Variáveis</text><text x="970" y="467">Pré-processamento</text><text x="1240" y="467">Notebook</text>
    </g>
    <g fill="#c2d3da" font-family="Arial,sans-serif" font-size="22" text-anchor="middle">
      <text x="670" y="534">categóricas</text><text x="970" y="534">dados</text><text x="1240" y="534">exploração</text>
    </g>
  </g>
<g aria-hidden="true"><circle r="12" fill="#7ee8c1" stroke="#f4f9fb" stroke-width="3" aria-hidden="true">
  <animateMotion path="M680 183 H710 H850 H880 H1020 H1050 H1190 H1220 H1360" dur="10s" begin="0s" keyPoints="0;1;1" keyTimes="0;.34;1" calcMode="linear" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.34;.4;.94;1" dur="10s" begin="0s" repeatCount="indefinite"/>
</circle>
<circle r="11" fill="#8fd3ff" stroke="#f4f9fb" stroke-width="3" aria-hidden="true">
  <animateMotion path="M790 458 H820 H1120 H1150" dur="10s" begin="5s" keyPoints="0;1;1" keyTimes="0;.34;1" calcMode="linear" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.34;.4;.94;1" dur="10s" begin="5s" repeatCount="indefinite"/>
</circle>
<animate href="#development-card" attributeName="stroke-width" values="3;4;4;3" keyTimes="0;.05;.34;1" dur="10s" begin="0s" repeatCount="indefinite"/>
<animate href="#data-card" attributeName="stroke-width" values="2;2;4;4;2" keyTimes="0;.44;.5;.84;1" dur="10s" begin="0s" repeatCount="indefinite"/>
<animate href="#chip-development" attributeName="stroke-width" values="3;4;4;3" keyTimes="0;.05;.34;1" dur="10s" begin="0s" repeatCount="indefinite"/>
<animate href="#chip-data" attributeName="stroke-width" values="2;2;4;4;2" keyTimes="0;.44;.5;.84;1" dur="10s" begin="0s" repeatCount="indefinite"/></g>
</svg>
