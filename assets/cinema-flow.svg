<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Sistema de Cinema · fluxo de compra nas duas implementações</title>
  <desc id="desc">Diagrama fiel ao código. No terminal, CinemaView, CinemaController, Usuario, três estratégias alternativas de preço, Sessao, Sala, Bilhete e PersistenciaArquivo. Na Web, ProgramacaoPage e CompraPage enviam POST /sessoes/{id}/comprar por Axios em localhost:8080 a SessaoController, SessaoRepository e H2; a resposta retorna em trilha tracejada. Nenhum movimento é necessário para ler o fluxo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131a"/><stop offset="1" stop-color="#102f3c"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#b5e4f3" stroke-opacity=".05"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8fd3ff"/></marker>
    <marker id="arrow-response" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffe09a"/></marker>
  </defs>
  <rect width="1440" height="820" rx="24" fill="url(#bg)"/><rect width="1440" height="820" rx="24" fill="url(#grid)"/>
  <text x="40" y="54" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="30" font-weight="700">Sistema de Cinema · POO · duas implementações</text>
  <g data-panel="terminal">
    <rect class="panel-card" x="32" y="90" width="670" height="690" rx="20" fill="#0c1f29" stroke="#7ee8c1" stroke-width="3"/>
    <text x="60" y="140" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="28" font-weight="700">Terminal · Java</text>
    <path d="M367 235V265M367 325V355M367 505V535M367 605V630" fill="none" stroke="#8fd3ff" stroke-width="3" marker-end="url(#arrow)"/>
    <rect class="node" x="60" y="175" width="614" height="60" rx="12" fill="#102a36" stroke="#52717d" stroke-width="2"/>
    <text x="84" y="214" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="22" font-weight="700">CinemaView</text>
    <rect class="node" x="60" y="265" width="614" height="60" rx="12" fill="#102a36" stroke="#52717d" stroke-width="2"/>
    <text x="84" y="304" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="22" font-weight="700">CinemaController</text>
    <rect class="node" x="60" y="355" width="614" height="150" rx="12" fill="#102a36" stroke="#52717d" stroke-width="2"/>
    <text x="84" y="391" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="22" font-weight="700">Usuario → EstrategiaPreco</text>
    <g class="strategy-option">
      <rect id="strategy-common" x="80" y="412" width="180" height="72" rx="10" fill="#0c1f29" stroke="#52717d" stroke-width="2"/>
      <text x="170" y="442" text-anchor="middle" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="22" font-weight="700">Comum</text>
      <text x="170" y="470" text-anchor="middle" fill="#c2d3da" font-family="Arial,sans-serif" font-size="22">preço-base</text>
    </g>
    <g class="strategy-option">
      <rect id="strategy-critical" x="277" y="412" width="180" height="72" rx="10" fill="#0c1f29" stroke="#52717d" stroke-width="2"/>
      <text x="367" y="442" text-anchor="middle" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="22" font-weight="700">Crítico</text>
      <text x="367" y="470" text-anchor="middle" fill="#c2d3da" font-family="Arial,sans-serif" font-size="22">R$ 0</text>
    </g>
    <g class="strategy-option">
      <rect id="strategy-student" x="474" y="412" width="180" height="72" rx="10" fill="#0c1f29" stroke="#52717d" stroke-width="2"/>
      <text x="564" y="442" text-anchor="middle" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="22" font-weight="700">Estudante</text>
      <text x="564" y="470" text-anchor="middle" fill="#c2d3da" font-family="Arial,sans-serif" font-size="22">metade</text>
    </g>
    <rect class="node" x="60" y="535" width="614" height="70" rx="12" fill="#102a36" stroke="#52717d" stroke-width="2"/>
    <text x="84" y="579" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="22" font-weight="700">Sessao · Sala · Bilhete</text>
    <rect class="node" x="60" y="630" width="614" height="90" rx="12" fill="#102a2b" stroke="#52717d" stroke-width="2"/>
    <text x="84" y="669" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="22" font-weight="700">PersistenciaArquivo</text>
    <text x="84" y="701" fill="#c2d3da" font-family="Arial,sans-serif" font-size="22">filmes.txt · usuarios.txt</text>
    <path id="console-route" d="M367 205V295V430H170H367H564H367V570V675" fill="none"/>
    <circle class="console-token" cx="367" cy="205" r="15" fill="#7ee8c1" stroke="#f4f9fb" stroke-width="3" opacity="0"/>
  </g>
  <g data-panel="web">
    <rect class="panel-card" x="738" y="90" width="670" height="690" rx="20" fill="#0c1f29" stroke="#52717d" stroke-width="2"/>
    <text x="766" y="140" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="28" font-weight="700">Web · React + Vite + Spring Boot</text>
    <text x="766" y="171" fill="#c2d3da" font-family="Arial,sans-serif" font-size="22">● requisição   ■ resposta (trilha tracejada)</text>
    <path d="M1335 219V677" fill="none" stroke="#8fd3ff" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1370 677V219" fill="none" stroke="#ffe09a" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow-response)"/>
    <g fill="#102a36" stroke="#52717d" stroke-width="2">
      <rect class="node" x="766" y="190" width="610" height="58" rx="12"/>
      <rect class="node" x="766" y="276" width="610" height="58" rx="12"/>
      <rect class="node" x="766" y="362" width="610" height="58" rx="12"/>
      <rect class="node" x="766" y="448" width="610" height="58" rx="12"/>
      <rect class="node" x="766" y="534" width="610" height="58" rx="12"/>
    </g>
    <rect class="node" x="766" y="620" width="610" height="58" rx="12" fill="#102a2b" stroke="#52717d" stroke-width="2"/>
    <g fill="#f4f9fb" font-family="Arial,sans-serif" font-size="22" font-weight="700">
      <text x="790" y="227">ProgramacaoPage → CompraPage</text>
      <text x="790" y="313">Axios · localhost:8080</text>
      <text x="790" y="399">POST /sessoes/{id}/comprar</text>
      <text x="790" y="485">SessaoController</text>
      <text x="790" y="571">SessaoRepository · Spring Data JPA</text>
      <text x="790" y="657">Banco H2</text>
    </g>
    <circle class="request-token" cx="1335" cy="219" r="15" fill="#8fd3ff" stroke="#f4f9fb" stroke-width="3" opacity="0"/>
    <rect class="response-token" x="1358" y="665" width="24" height="24" rx="3" fill="#ffe09a" stroke="#07131a" stroke-width="2" opacity="0"/>
  </g>
<g aria-hidden="true"><circle r="13" fill="#7ee8c1" stroke="#f4f9fb" stroke-width="3" aria-hidden="true">
  <animateMotion path="M367 205 V295 V391 V405 H170 H367 H564 H672 V510 H367 V570 V675" dur="18s" begin="0s" keyPoints="0;1;1" keyTimes="0;.76;1" calcMode="linear" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.76;.84;.96;1" dur="18s" begin="0s" repeatCount="indefinite"/>
</circle>
<circle class="request-token" cx="1335" cy="219" r="13" fill="#8fd3ff" stroke="#f4f9fb" stroke-width="3"><animateMotion path="M0 0 V458" dur="18s" keyPoints="0;0;1;1;1" keyTimes="0;.02;.72;.76;1" calcMode="linear" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;1;0;0" keyTimes="0;.72;.76;.8;1" dur="18s" repeatCount="indefinite"/></circle>
<rect class="response-token" x="1358" y="665" width="26" height="26" rx="3" fill="#ffe09a" stroke="#07131a" stroke-width="2"><animateMotion path="M0 0 V-458" dur="18s" keyPoints="0;0;1;1;1" keyTimes="0;.48;.78;.82;1" calcMode="linear" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.48;.52;.78;.82;1" dur="18s" repeatCount="indefinite"/></rect>
<animate href="#strategy-common" attributeName="stroke-width" values="2;2;4;4;2;2" keyTimes="0;.29;.30;.34;.35;1" dur="18s" begin="0s" repeatCount="indefinite"/>
<animate href="#strategy-critical" attributeName="stroke-width" values="2;2;4;4;2;2" keyTimes="0;.42;.43;.47;.48;1" dur="18s" begin="0s" repeatCount="indefinite"/>
<animate href="#strategy-student" attributeName="stroke-width" values="2;2;4;4;2;2" keyTimes="0;.55;.56;.60;.61;1" dur="18s" begin="0s" repeatCount="indefinite"/></g>
</svg>
