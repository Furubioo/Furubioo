<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1130" role="img" aria-labelledby="t d"><title id="t">Três estudos do repositório acadêmico: compilador, hardware e concorrência</title><desc id="d">Três cenas. Compilador em C: a linha y = x + 5; dividida em tokens, consumidos pelo parser até o resultado sucesso. Hardware: jogo de memória na Raspberry Pi com LEDs nos GPIO 18, 23 e 24, botões nos GPIO 27, 17 e 22 e LEDs de feedback 15 (certo) e 14 (errado). Concorrência: algoritmo de Peterson com wants[0] e wants[1] verdadeiros, turn = 0, T0 na seção crítica e T1 aguardando com sched_yield.</desc><defs>
