<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Partilhar · sequência real das seções do site</title>
  <desc id="desc">Mapa estático na ordem do HTML: Início, Sobre, Serviços, Galeria, Voluntariado, Depoimentos e Doações. A Galeria lista cinco imagens; os Depoimentos têm três itens no carrossel implementado em JavaScript.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131a"/><stop offset="1" stop-color="#102f3c"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#8fd3ff"/></marker>
  </defs>
  <rect width="1200" height="390" rx="24" fill="url(#bg)"/>
  <text x="32" y="54" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="28" font-weight="700">Partilhar · sequência real da página</text>
  <text x="32" y="89" fill="#c2d3da" font-family="Arial,sans-serif" font-size="18">Cinco imagens na galeria · três depoimentos · carrossel no JavaScript</text>
  <path d="M171 213H1028" fill="none" stroke="#8fd3ff" stroke-width="3" marker-end="url(#arrow)"/>
  <g class="section-node">
    <rect id="section-home" x="32" y="153" width="142" height="120" rx="14" fill="#102a36" stroke="#52717d" stroke-width="2"/>
    <text x="103" y="221" text-anchor="middle" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="18" font-weight="700">Início</text>
  </g>
  <g class="section-node">
    <rect id="section-about" x="197" y="153" width="142" height="120" rx="14" fill="#102a36" stroke="#52717d" stroke-width="2"/>
    <text x="268" y="221" text-anchor="middle" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="18" font-weight="700">Sobre</text>
  </g>
  <g class="section-node">
    <rect id="section-services" x="362" y="153" width="142" height="120" rx="14" fill="#102a36" stroke="#52717d" stroke-width="2"/>
    <text x="433" y="221" text-anchor="middle" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="18" font-weight="700">Serviços</text>
  </g>
  <g class="section-node">
    <rect id="section-gallery" x="527" y="153" width="142" height="120" rx="14" fill="#102a36" stroke="#52717d" stroke-width="2"/>
    <text x="598" y="211" text-anchor="middle" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="18" font-weight="700">Galeria</text>
    <text x="598" y="241" text-anchor="middle" fill="#c2d3da" font-family="Arial,sans-serif" font-size="18">5 imagens</text>
  </g>
  <g class="section-node">
    <rect id="section-volunteer" x="692" y="153" width="142" height="120" rx="14" fill="#102a36" stroke="#52717d" stroke-width="2"/>
    <text x="763" y="211" text-anchor="middle" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="18" font-weight="700">Voluntariado</text>
    <text x="763" y="241" text-anchor="middle" fill="#c2d3da" font-family="Arial,sans-serif" font-size="18">formulário</text>
  </g>
  <g class="section-node">
    <rect id="section-testimonials" x="857" y="153" width="142" height="120" rx="14" fill="#102a36" stroke="#52717d" stroke-width="2"/>
    <text x="928" y="211" text-anchor="middle" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="18" font-weight="700">Depoimentos</text>
    <g fill="#8fd3ff"><circle id="testimonial-dot-1" cx="916" cy="245" r="5"/><circle id="testimonial-dot-2" cx="928" cy="245" r="5"/><circle id="testimonial-dot-3" cx="940" cy="245" r="5"/></g>
  </g>
  <g class="section-node">
    <rect id="section-donations" x="1022" y="153" width="142" height="120" rx="14" fill="#102a36" stroke="#52717d" stroke-width="2"/>
    <text x="1093" y="221" text-anchor="middle" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="18" font-weight="700">Doações</text>
  </g>
  <text x="32" y="337" fill="#c2d3da" font-family="Arial,sans-serif" font-size="18">Navegação e conteúdo seguem a ordem do HTML, inclusive a posição do formulário antes dos depoimentos.</text>
</svg>
