<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 810" role="img" aria-labelledby="title desc">
  <title id="title">Mapa de conteúdo do Site ONG Partilhar</title>
  <desc id="desc">Ilustração vertical esquemática, não uma captura de tela. Resume a apresentação, os conteúdos sobre a ONG, quatro categorias de serviços, galeria, depoimentos e chamadas para voluntariado e doações.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5f0e8"/><stop offset="1" stop-color="#edf4ee"/></linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#2d5049" opacity=".08"/></pattern>
  </defs>
  <rect width="400" height="810" rx="20" fill="url(#paper)"/><rect width="400" height="810" rx="20" fill="url(#dots)"/>
  <text x="20" y="30" fill="#57736b" font-family="ui-monospace,monospace" font-size="8" font-weight="700" letter-spacing="1">SITE ONG PARTILHAR · MAPA · NÃO É CAPTURA</text>
  <rect x="16" y="48" width="368" height="50" rx="10" fill="#b5cec0"/>
  <text x="32" y="79" fill="#2d5049" font-family="Arial,sans-serif" font-size="13" font-weight="700">Partilhar</text>
  <text x="375" y="79" text-anchor="end" fill="#2d5049" font-family="ui-monospace,monospace" font-size="9">menu de navegação</text>

  <rect x="16" y="114" width="368" height="105" rx="12" fill="#fffdf8" stroke="#d6d7ca"/>
  <text x="32" y="139" fill="#2d5049" font-family="ui-monospace,monospace" font-size="8" font-weight="700" letter-spacing="1">INÍCIO · MISSÃO</text>
  <text x="32" y="165" fill="#2d5049" font-family="Arial,sans-serif" font-size="15" font-weight="700">Construindo juntos,</text>
  <text x="32" y="185" fill="#2d5049" font-family="Arial,sans-serif" font-size="15" font-weight="700">um mundo melhor</text>
  <text x="32" y="205" fill="#57736b" font-family="Arial,sans-serif" font-size="9">bem-estar mental e emocional</text>

  <rect x="16" y="235" width="368" height="112" rx="12" fill="#fffdf8" stroke="#d6d7ca"/>
  <text x="32" y="260" fill="#2d5049" font-family="ui-monospace,monospace" font-size="8" font-weight="700" letter-spacing="1">SOBRE A ONG</text>
  <text x="32" y="287" fill="#2d5049" font-family="Arial,sans-serif" font-size="12" font-weight="700">Quem somos? · O que fazemos?</text>
  <text x="32" y="310" fill="#2d5049" font-family="Arial,sans-serif" font-size="12" font-weight="700">Por que fazemos?</text>
  <text x="32" y="332" fill="#57736b" font-family="Arial,sans-serif" font-size="9">acolhimento · escuta · bem-estar</text>

  <rect x="16" y="363" width="368" height="142" rx="12" fill="#fffdf8" stroke="#d6d7ca"/>
  <text x="32" y="389" fill="#2d5049" font-family="ui-monospace,monospace" font-size="8" font-weight="700" letter-spacing="1">SERVIÇOS · QUATRO CATEGORIAS</text>
  <text x="32" y="416" fill="#2d5049" font-family="Arial,sans-serif" font-size="11">Saúde mental e bem-estar</text>
  <text x="32" y="439" fill="#2d5049" font-family="Arial,sans-serif" font-size="11">Cultura e arte</text>
  <text x="32" y="462" fill="#2d5049" font-family="Arial,sans-serif" font-size="11">Ação social</text>
  <text x="32" y="485" fill="#2d5049" font-family="Arial,sans-serif" font-size="11">Educação e prevenção</text>

  <rect x="16" y="521" width="368" height="94" rx="12" fill="#dce8df" stroke="#b5cec0"/>
  <text x="32" y="548" fill="#2d5049" font-family="ui-monospace,monospace" font-size="8" font-weight="700" letter-spacing="1">GALERIA · DEPOIMENTOS</text>
  <text x="32" y="575" fill="#57736b" font-family="Arial,sans-serif" font-size="11">cinco imagens · três histórias</text>
  <text x="32" y="597" fill="#57736b" font-family="Arial,sans-serif" font-size="9">carrossel de depoimentos no JavaScript</text>

  <rect x="16" y="631" width="368" height="96" rx="12" fill="#f5c842" stroke="#dfbc45"/>
  <text x="32" y="660" fill="#2d5049" font-family="ui-monospace,monospace" font-size="8" font-weight="700" letter-spacing="1">PARTICIPAÇÃO</text>
  <text x="32" y="689" fill="#2d5049" font-family="Arial,sans-serif" font-size="12" font-weight="700">Voluntariado · doações</text>
  <text x="32" y="709" fill="#2d5049" font-family="Arial,sans-serif" font-size="9">formulário de cadastro no site</text>
  <text x="200" y="770" text-anchor="middle" fill="#57736b" font-family="ui-monospace,monospace" font-size="8">HTML/CSS/JavaScript · esquema baseado no repositório</text>
</svg>
