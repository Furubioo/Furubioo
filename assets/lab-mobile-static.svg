<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1100" role="img" aria-labelledby="t d"><title id="t">Três estudos do repositório acadêmico: compilador, hardware e concorrência</title><desc id="d">Três cenas. Compilador: a linha total = a + 2; dividida em tokens e organizada em árvore sintática. Hardware: jogo de memória em GPIO, com LEDs numerados pela ordem da sequência e botões. Concorrência: algoritmo de Peterson, com a thread T0 na seção crítica e a T1 esperando; turn = 0.</desc><defs>
