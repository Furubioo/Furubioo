<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 48" role="img" aria-labelledby="title description">
  <title id="title">Interesses em tecnologia</title>
  <desc id="description">Faixa animada que alterna entre três temas: redes, sistemas e hardware; C, Python, Java e Jupyter; e entender como as coisas funcionam por dentro. Em preferência por movimento reduzido, permanece na primeira frase.</desc>
  <style>
    @media (prefers-reduced-motion: reduce) {
      .motion { display: none; }
    }
  </style>
  <rect width="760" height="48" rx="24" fill="#10232c"/>
  <text x="380" y="30" text-anchor="middle" fill="#8fd3ff" font-family="Consolas, 'Courier New', monospace" font-size="17" letter-spacing="0.3">REDES · SISTEMAS · HARDWARE
    <animate class="motion" attributeName="opacity" values="1;1;0;0" keyTimes="0;0.24;0.30;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="380" y="30" text-anchor="middle" fill="#8fd3ff" font-family="Consolas, 'Courier New', monospace" font-size="17" letter-spacing="0.3" opacity="0">C · PYTHON · JAVA · JUPYTER
    <animate class="motion" attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.33;0.39;0.65;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="380" y="30" text-anchor="middle" fill="#7ee8c1" font-family="Consolas, 'Courier New', monospace" font-size="16" letter-spacing="0.1" opacity="0">ENTENDER COMO AS COISAS FUNCIONAM POR DENTRO
    <animate class="motion" attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.66;0.72;0.96;1" dur="12s" repeatCount="indefinite"/>
  </text>
</svg>
