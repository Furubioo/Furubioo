<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 700" role="img" aria-labelledby="title desc">
  <title id="title">Laboratório · parsing, GPIO e algoritmo de Peterson</title>
  <desc id="desc">Três painéis estáticos resumem cenas coerentes com os projetos: árvore de expressão para total = a + 2; LEDs GPIO 18, 23 e 24, botões 27, 17 e 22, feedback correto no GPIO 15 e incorreto no GPIO 14; Peterson com wants[2], turn = 0, T0 na seção crítica e T1 aguardando via sched_yield(). Nunca há duas threads na seção crítica.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131a"/><stop offset="1" stop-color="#102f3c"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#8fd3ff"/></marker>
  </defs>
  <rect width="1440" height="700" rx="24" fill="url(#bg)"/>
  <text x="36" y="54" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="28" font-weight="700">Laboratório · parsing · GPIO · sincronização</text>
  <g id="panel-parser" data-panel="parser">
    <rect class="panel-card" x="32" y="88" width="438" height="570" rx="18" fill="#0c1f29" stroke="#52717d" stroke-width="2"/>
    <text x="56" y="132" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="22" font-weight="700">01 · Parsing</text>
    <text x="56" y="181" fill="#8fd3ff" font-family="Arial,sans-serif" font-size="22">total = a + 2;</text>
    <path d="M250 251V284M250 284H133V317M250 284H370V317" fill="none" stroke="#8fd3ff" stroke-width="3" marker-end="url(#arrow)"/>
    <rect id="parser-root" x="148" y="208" width="204" height="54" rx="12" fill="#102a36" stroke="#8fd3ff" stroke-width="2"/>
    <text x="250" y="242" text-anchor="middle" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="22" font-weight="700">Atribuição</text>
    <rect id="parser-left" x="56" y="317" width="154" height="60" rx="12" fill="#102a36" stroke="#52717d" stroke-width="2"/>
    <text x="133" y="355" text-anchor="middle" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="22">total</text>
    <rect id="parser-sum" x="293" y="317" width="154" height="60" rx="12" fill="#102a36" stroke="#52717d" stroke-width="2"/>
    <text x="370" y="355" text-anchor="middle" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="22" font-weight="700">Soma</text>
    <path d="M370 377V411M370 411H282V445M370 411H394V445" fill="none" stroke="#8fd3ff" stroke-width="3" marker-end="url(#arrow)"/>
    <rect id="parser-a" x="220" y="445" width="124" height="60" rx="12" fill="#102a36" stroke="#52717d" stroke-width="2"/>
    <text x="282" y="483" text-anchor="middle" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="22">a</text>
    <rect id="parser-constant" x="344" y="445" width="100" height="60" rx="12" fill="#102a36" stroke="#52717d" stroke-width="2"/>
    <text x="394" y="483" text-anchor="middle" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="22">2</text>
    <text x="56" y="574" fill="#c2d3da" font-family="Arial,sans-serif" font-size="22">Árvore sintática · fluxo legível</text>
  </g>
  <g id="panel-gpio" data-panel="gpio">
    <rect class="panel-card" x="501" y="88" width="438" height="570" rx="18" fill="#0c1f29" stroke="#52717d" stroke-width="2"/>
    <text x="525" y="132" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="22" font-weight="700">02 · Jogo GPIO</text>
    <text x="525" y="184" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="22">LEDs · 18 → 23 → 24</text>
    <path d="M552 222H885" stroke="#8fd3ff" stroke-width="3" marker-end="url(#arrow)"/>
    <g fill="#102a36" stroke="#52717d" stroke-width="2"><circle id="led-18" cx="570" cy="222" r="15"/><circle id="led-23" cx="713" cy="222" r="15"/><circle id="led-24" cx="856" cy="222" r="15"/></g>
    <text x="525" y="285" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="22">Botões · 27 · 17 · 22</text>
    <rect x="525" y="321" width="390" height="74" rx="12" fill="#102a36" stroke="#52717d" stroke-width="2"/>
    <text x="549" y="367" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="22">Entrada → resposta</text>
    <g fill="#102a36" stroke="#52717d" stroke-width="2"><circle id="button-27" cx="826" cy="358" r="10"/><circle id="button-17" cx="858" cy="358" r="10"/><circle id="button-22" cx="890" cy="358" r="10"/></g>
    <rect id="gpio-correct" x="525" y="425" width="390" height="70" rx="12" fill="#12372c" stroke="#7ee8c1" stroke-width="2"/>
    <text x="549" y="469" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="22" font-weight="700">Correto · GPIO 15</text>
    <rect id="gpio-incorrect" x="525" y="514" width="390" height="70" rx="12" fill="#3c2525" stroke="#ffaaa0" stroke-width="2"/>
    <text x="549" y="558" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="22" font-weight="700">Incorreto · GPIO 14</text>
  </g>
  <g id="panel-peterson" data-panel="peterson">
    <rect class="panel-card" x="970" y="88" width="438" height="570" rx="18" fill="#0c1f29" stroke="#52717d" stroke-width="2"/>
    <text x="994" y="132" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="22" font-weight="700">03 · Peterson</text>
    <text x="994" y="183" fill="#8fd3ff" font-family="Arial,sans-serif" font-size="22">wants[0] = wants[1] = true</text>
    <text id="peterson-turn-zero" x="994" y="220" fill="#8fd3ff" font-family="Arial,sans-serif" font-size="22">turn = 0</text>
    <text id="peterson-turn-one" x="994" y="220" fill="#8fd3ff" font-family="Arial,sans-serif" font-size="22" opacity="0">turn = 1</text>
    <rect id="peterson-t0" x="994" y="258" width="390" height="104" rx="14" fill="#12372c" stroke="#7ee8c1" stroke-width="3"/>
    <text id="peterson-t0-active" x="1018" y="302" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="22" font-weight="700">T0 · seção crítica</text>
    <text id="peterson-t0-wait" x="1018" y="302" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="22" font-weight="700" opacity="0">T0 · espera</text>
    <text id="peterson-t0-critical-note" x="1018" y="337" fill="#c2d3da" font-family="Arial,sans-serif" font-size="22">única thread no recurso</text>
    <text id="peterson-t0-wait-note" x="1018" y="337" fill="#c2d3da" font-family="Arial,sans-serif" font-size="22" opacity="0">aguarda sua vez</text>
    <rect id="peterson-t1" x="994" y="386" width="390" height="112" rx="14" fill="#102a36" stroke="#52717d" stroke-width="2"/>
    <text id="peterson-t1-wait" x="1018" y="430" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="22" font-weight="700">T1 · espera</text>
    <text id="peterson-t1-active" x="1018" y="430" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="22" font-weight="700" opacity="0">T1 · seção crítica</text>
    <text id="peterson-yield" x="1018" y="468" fill="#c2d3da" font-family="Arial,sans-serif" font-size="22">thread em espera · sched_yield()</text>
    <text id="peterson-t1-active-note" x="1018" y="468" fill="#c2d3da" font-family="Arial,sans-serif" font-size="22" opacity="0">única thread no recurso</text>
    <path d="M1189 498V541" stroke="#8fd3ff" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="994" y="582" fill="#c2d3da" font-family="Arial,sans-serif" font-size="22">A exclusão mútua é preservada.</text>
  </g>
