<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title description">
  <title id="title">Duas implementações do Sistema de Cinema</title>
  <desc id="description">O projeto se divide em duas implementações paralelas: uma aplicação de terminal em Java, MVC e persistência em arquivo; e uma aplicação web com React, Vite, Spring Boot e H2.</desc>
  <style>
    :root {
      color-scheme: light dark;
      --background: #f5f9fb;
      --surface: #ffffff;
      --surface-alt: #eaf3f7;
      --border: #c9dce5;
      --text: #17313c;
      --muted: #4c6875;
      --blue: #287da0;
      --blue-soft: #d8eef8;
      --green: #287b68;
      --green-soft: #ddf3eb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #0f2027;
        --surface: #172d36;
        --surface-alt: #203d49;
        --border: #355562;
        --text: #e8f4f8;
        --muted: #a8c1cb;
        --blue: #8fd3ff;
        --blue-soft: #1d4353;
        --green: #7ee8c1;
        --green-soft: #1e443c;
      }
    }

    text {
      font-family: "Segoe UI", Arial, sans-serif;
      fill: var(--text);
    }

    .muted {
      fill: var(--muted);
    }

    .connector {
      fill: none;
      stroke: var(--border);
      stroke-width: 2;
    }

    .flow-dash {
      fill: none;
      stroke: var(--blue);
      stroke-dasharray: 5 9;
      stroke-linecap: round;
      stroke-width: 2;
    }

    @media (prefers-reduced-motion: reduce) {
      .motion { display: none; }
    }
  </style>

  <rect width="1000" height="500" rx="24" fill="var(--background)"/>

  <text x="500" y="43" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2.2" class="muted">PROJETO ACADÊMICO · UNICAP</text>
  <text x="500" y="78" text-anchor="middle" font-size="27" font-weight="700">Sistema de Cinema</text>
  <text x="500" y="104" text-anchor="middle" font-size="14" class="muted">Duas implementações independentes do mesmo domínio</text>

  <path class="connector" d="M500 119v22M255 141h490M255 141v22M745 141v22"/>
  <path class="flow-dash" d="M500 119v22M255 141h490M255 141v22M745 141v22">
    <animate class="motion" attributeName="stroke-dashoffset" values="0;-112" dur="8s" repeatCount="indefinite"/>
  </path>

  <rect x="42" y="163" width="444" height="294" rx="18" fill="var(--surface)" stroke="var(--border)"/>
  <rect x="514" y="163" width="444" height="294" rx="18" fill="var(--surface)" stroke="var(--border)"/>

  <rect x="66" y="185" width="36" height="24" rx="12" fill="var(--blue-soft)"/>
  <text x="84" y="202" text-anchor="middle" font-size="12" font-weight="700" fill="var(--blue)">01</text>
  <text x="114" y="203" font-size="19" font-weight="700">Versão de terminal</text>
  <text x="66" y="229" font-size="13" class="muted">Aplicação Java organizada em camadas</text>

  <rect x="66" y="248" width="396" height="52" rx="11" fill="var(--surface-alt)"/>
  <text x="84" y="270" font-size="14" font-weight="700">MVC</text>
  <text x="84" y="289" font-size="12" class="muted">Model · View · Controller</text>

  <path class="connector" d="M264 300v17"/>
  <rect x="66" y="317" width="396" height="52" rx="11" fill="var(--surface-alt)"/>
  <text x="84" y="339" font-size="14" font-weight="700">Strategy</text>
  <text x="84" y="358" font-size="12" class="muted">Estratégias para cálculo de preços</text>

  <path class="connector" d="M264 369v17"/>
  <rect x="66" y="386" width="396" height="46" rx="11" fill="var(--blue-soft)"/>
  <text x="84" y="414" font-size="13" font-weight="700" fill="var(--blue)">Persistência em arquivo</text>

  <rect x="538" y="185" width="36" height="24" rx="12" fill="var(--green-soft)"/>
  <text x="556" y="202" text-anchor="middle" font-size="12" font-weight="700" fill="var(--green)">02</text>
  <text x="586" y="203" font-size="19" font-weight="700">Versão web</text>
  <text x="538" y="229" font-size="13" class="muted">Frontend e backend em aplicações separadas</text>

  <rect x="538" y="248" width="396" height="52" rx="11" fill="var(--surface-alt)"/>
  <text x="556" y="270" font-size="14" font-weight="700">React + Vite</text>
  <text x="556" y="289" font-size="12" class="muted">Interface web</text>

  <path class="connector" d="M736 300v17"/>
  <rect x="538" y="317" width="396" height="52" rx="11" fill="var(--surface-alt)"/>
  <text x="556" y="339" font-size="14" font-weight="700">Spring Boot</text>
  <text x="556" y="358" font-size="12" class="muted">Backend da aplicação</text>

  <path class="connector" d="M736 369v17"/>
  <rect x="538" y="386" width="396" height="46" rx="11" fill="var(--green-soft)"/>
  <text x="556" y="414" font-size="13" font-weight="700" fill="var(--green)">Banco de dados H2</text>
</svg>
