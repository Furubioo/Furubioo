<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 780" role="img" aria-labelledby="title desc">
  <title id="title">Flávio Daniel · desenvolvimento, dados e interesse em IA</title>
  <desc id="desc">Versão vertical para celular. Desenvolvimento e dados têm exemplos de projetos; IA aparece somente como interesse, em contorno tracejado. Os fluxos completos seguem nos dois cartões.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131a"/><stop offset="1" stop-color="#102f3c"/></linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#b5e4f3" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="400" height="780" rx="20" fill="url(#bg)"/><rect width="400" height="780" rx="20" fill="url(#grid)"/>
  <g data-panel="identity">
    <text x="20" y="46" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="30" font-weight="700">Flávio Daniel</text>
    <text x="20" y="76" fill="#c2d3da" font-family="Arial,sans-serif" font-size="13">Ciência da Computação · UNICAP</text>
    <text x="20" y="98" fill="#c2d3da" font-family="Arial,sans-serif" font-size="13">Técnico em Redes de Computadores</text>
    <rect id="chip-development" x="20" y="116" width="190" height="42" rx="12" fill="#153a34" stroke="#7ee8c1" stroke-width="3"/>
    <text x="115" y="143" text-anchor="middle" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="13" font-weight="700">Desenvolvimento</text>
    <rect id="chip-data" x="220" y="116" width="110" height="42" rx="12" fill="#153244" stroke="#8fd3ff" stroke-width="2"/>
    <text x="275" y="143" text-anchor="middle" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="13" font-weight="700">Dados</text>
    <rect x="20" y="168" width="160" height="42" rx="12" fill="#0c1f29" stroke="#ffe09a" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="100" y="195" text-anchor="middle" fill="#fff2c2" font-family="Arial,sans-serif" font-size="13" font-weight="700">IA · interesse</text>
  </g>
  <g data-panel="development">
    <rect id="development-card" class="panel-card" x="16" y="226" width="368" height="230" rx="16" fill="#0c1f29" stroke="#7ee8c1" stroke-width="3"/>
    <text x="32" y="257" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="13" font-weight="700">01 · DESENVOLVIMENTO · CINEMA WEB</text>
    <path d="M60 342H340" stroke="#52717d" stroke-width="2"/>
    <g fill="#102a36" stroke="#52717d" stroke-width="2">
      <rect x="34" y="316" width="52" height="52" rx="10"/><rect x="104" y="316" width="52" height="52" rx="10"/>
      <rect x="174" y="316" width="52" height="52" rx="10"/><rect x="244" y="316" width="52" height="52" rx="10"/>
      <rect x="314" y="316" width="52" height="52" rx="10"/>
    </g>
    <g fill="#f4f9fb" font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle">
      <text x="60" y="347">UI</text><text x="130" y="347">HTTP</text><text x="200" y="347">API</text><text x="270" y="347">JPA</text><text x="340" y="347">H2</text>
    </g>
    <text x="200" y="405" text-anchor="middle" fill="#c2d3da" font-family="Arial,sans-serif" font-size="13">React · Axios · Spring · JPA · H2</text>
    <text x="200" y="434" text-anchor="middle" fill="#c2d3da" font-family="Arial,sans-serif" font-size="13">interface → banco de dados</text>
  </g>
  <g data-panel="data">
    <rect id="data-card" class="panel-card" x="16" y="476" width="368" height="250" rx="16" fill="#0c1f29" stroke="#52717d" stroke-width="2"/>
    <text x="32" y="507" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="13" font-weight="700">02 · DADOS · SCORE DE CRÉDITO</text>
    <path d="M80 612H200M200 612H320" stroke="#52717d" stroke-width="2"/>
    <g fill="#102a36" stroke="#52717d" stroke-width="2">
      <rect x="32" y="584" width="96" height="56" rx="10"/><rect x="132" y="584" width="136" height="56" rx="10"/>
      <rect x="272" y="584" width="96" height="56" rx="10"/>
    </g>
    <g fill="#f4f9fb" font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle">
      <text x="80" y="618">Variáveis</text><text x="200" y="618">Pré-processamento</text><text x="320" y="618">Notebook</text>
    </g>
    <text x="200" y="676" text-anchor="middle" fill="#c2d3da" font-family="Arial,sans-serif" font-size="13">dados categóricos · projeto acadêmico</text>
  </g>
<g aria-hidden="true"><circle r="9" fill="#7ee8c1" stroke="#f4f9fb" stroke-width="3" aria-hidden="true">
  <animateMotion path="M86 342 H104 H156 H174 H226 H244 H296 H314 H366" dur="10s" begin="0s" keyPoints="0;1;1" keyTimes="0;.34;1" calcMode="linear" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.34;.4;.94;1" dur="10s" begin="0s" repeatCount="indefinite"/>
</circle>
<circle r="8" fill="#8fd3ff" stroke="#f4f9fb" stroke-width="3" aria-hidden="true">
  <animateMotion path="M132 612 H138 H262 H268" dur="10s" begin="5s" keyPoints="0;1;1" keyTimes="0;.34;1" calcMode="linear" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.34;.4;.94;1" dur="10s" begin="5s" repeatCount="indefinite"/>
</circle>
<animate href="#development-card" attributeName="stroke-width" values="3;4;4;3" keyTimes="0;.05;.34;1" dur="10s" begin="0s" repeatCount="indefinite"/>
<animate href="#data-card" attributeName="stroke-width" values="2;2;4;4;2" keyTimes="0;.44;.5;.84;1" dur="10s" begin="0s" repeatCount="indefinite"/>
<animate href="#chip-development" attributeName="stroke-width" values="3;4;4;3" keyTimes="0;.05;.34;1" dur="10s" begin="0s" repeatCount="indefinite"/>
<animate href="#chip-data" attributeName="stroke-width" values="2;2;4;4;2" keyTimes="0;.44;.5;.84;1" dur="10s" begin="0s" repeatCount="indefinite"/></g>
</svg>
