<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1160" role="img" aria-labelledby="title desc">
  <title id="title">Cinema: duas implementações acadêmicas</title>
  <desc id="desc">Diagrama vertical esquemático com a versão Java de terminal e a versão Web. Todas as camadas, estratégias de preço reais e persistências estão visíveis sem animação.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07131a"/><stop offset="1" stop-color="#102f3c"/></linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#b5e4f3" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="400" height="1160" rx="20" fill="url(#bg)"/>
  <rect width="400" height="1160" rx="20" fill="url(#grid)"/>
  <text x="22" y="36" fill="#7ee8c1" font-family="ui-monospace,monospace" font-size="9" font-weight="700" letter-spacing="1.4">PROJETO ACADÊMICO · POO</text>
  <text x="22" y="69" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="27" font-weight="700">Sistema de Cinema</text>
  <text x="22" y="91" fill="#a8c1cb" font-family="Arial,sans-serif" font-size="12">Duas implementações independentes · esquema</text>

  <rect x="16" y="112" width="368" height="460" rx="16" fill="#081920" stroke="#365867"/>
  <text x="34" y="142" fill="#8fd3ff" font-family="ui-monospace,monospace" font-size="9" font-weight="700" letter-spacing="1.2">01 · CINEMA-CONSOLE</text>
  <text x="34" y="168" fill="#eef6f9" font-family="Arial,sans-serif" font-size="18" font-weight="700">Terminal · Java</text>
  <path d="M200 224V242M200 288V306M200 408V426M200 472V490" stroke="#3f7f95" stroke-width="2"/>
  <path d="M196 238l4 5 4-5M196 302l4 5 4-5M196 422l4 5 4-5M196 486l4 5 4-5" fill="#8fd3ff"/>
  <rect x="34" y="184" width="332" height="40" rx="9" fill="#112733" stroke="#335767"/>
  <text x="48" y="209" fill="#eef6f9" font-family="Arial,sans-serif" font-size="13" font-weight="700">CinemaView · Terminal</text>
  <rect x="34" y="245" width="332" height="43" rx="9" fill="#112733" stroke="#335767"/>
  <text x="48" y="272" fill="#eef6f9" font-family="Arial,sans-serif" font-size="13" font-weight="700">CinemaController</text>
  <rect x="34" y="309" width="332" height="99" rx="9" fill="#112733" stroke="#335767"/>
  <text x="48" y="331" fill="#eef6f9" font-family="Arial,sans-serif" font-size="13" font-weight="700">Usuario → EstrategiaPreco</text>
  <text x="48" y="349" fill="#8aa8b4" font-family="ui-monospace,monospace" font-size="9">calcularPrecoFinal(precoBase)</text>
  <text x="48" y="372" fill="#a8c1cb" font-family="ui-monospace,monospace" font-size="9">Comum · base</text>
  <text x="160" y="372" fill="#a8c1cb" font-family="ui-monospace,monospace" font-size="9">Crítico · R$ 0</text>
  <text x="48" y="392" fill="#a8c1cb" font-family="ui-monospace,monospace" font-size="9">Estudante · metade do preço-base</text>
  <rect x="34" y="429" width="332" height="43" rx="9" fill="#112733" stroke="#335767"/>
  <text x="48" y="456" fill="#eef6f9" font-family="Arial,sans-serif" font-size="13" font-weight="700">Sessao · Sala · Bilhete</text>
  <rect x="34" y="493" width="332" height="55" rx="9" fill="#102a2b" stroke="#3b7568"/>
  <text x="48" y="518" fill="#7ee8c1" font-family="Arial,sans-serif" font-size="13" font-weight="700">PersistenciaArquivo</text>
  <text x="48" y="536" fill="#a8c1cb" font-family="ui-monospace,monospace" font-size="9">filmes.txt · usuarios.txt</text>

  <rect x="16" y="594" width="368" height="542" rx="16" fill="#081920" stroke="#365867"/>
  <text x="34" y="624" fill="#7ee8c1" font-family="ui-monospace,monospace" font-size="9" font-weight="700" letter-spacing="1.2">02 · CINEMA-SYSTEM</text>
  <text x="34" y="650" fill="#eef6f9" font-family="Arial,sans-serif" font-size="18" font-weight="700">Web · React + Vite</text>
  <path d="M200 708V726M200 772V790M200 836V854M200 900V918" stroke="#3f7f95" stroke-width="2"/>
  <path d="M196 722l4 5 4-5M196 786l4 5 4-5M196 850l4 5 4-5M196 914l4 5 4-5" fill="#8fd3ff"/>
  <rect x="34" y="668" width="332" height="40" rx="9" fill="#112733" stroke="#335767"/>
  <text x="48" y="693" fill="#eef6f9" font-family="Arial,sans-serif" font-size="12" font-weight="700">ProgramacaoPage → CompraPage</text>
  <rect x="34" y="729" width="332" height="43" rx="9" fill="#112733" stroke="#335767"/>
  <text x="48" y="756" fill="#eef6f9" font-family="Arial,sans-serif" font-size="12" font-weight="700">Axios · src/api/api.js</text>
  <rect x="34" y="793" width="332" height="43" rx="9" fill="#112733" stroke="#335767"/>
  <text x="48" y="811" fill="#eef6f9" font-family="Arial,sans-serif" font-size="12" font-weight="700">SessaoController</text>
  <text x="48" y="827" fill="#8aa8b4" font-family="ui-monospace,monospace" font-size="9">POST /sessoes/{id}/comprar</text>
  <rect x="34" y="857" width="332" height="43" rx="9" fill="#112733" stroke="#335767"/>
  <text x="48" y="884" fill="#eef6f9" font-family="Arial,sans-serif" font-size="12" font-weight="700">SessaoRepository · Spring Data JPA</text>
  <rect x="34" y="921" width="332" height="55" rx="9" fill="#102a2b" stroke="#3b7568"/>
  <text x="48" y="946" fill="#7ee8c1" font-family="Arial,sans-serif" font-size="13" font-weight="700">Banco H2</text>
  <text x="48" y="964" fill="#a8c1cb" font-family="ui-monospace,monospace" font-size="9">persistência local · cinema.backend</text>
  <text x="200" y="1006" text-anchor="middle" fill="#8aa8b4" font-family="ui-monospace,monospace" font-size="9">o controlador valida a cadeira, salva a sessão</text>
  <text x="200" y="1021" text-anchor="middle" fill="#8aa8b4" font-family="ui-monospace,monospace" font-size="9">e monta o bilhete</text>
  <text x="200" y="1107" text-anchor="middle" fill="#7d9ba7" font-family="ui-monospace,monospace" font-size="9">terminal acima · web abaixo</text>
</svg>
