<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1360" role="img" aria-labelledby="title desc">
  <title id="title">Laboratório · parsing, GPIO e sincronização</title>
  <desc id="desc">Versão vertical: árvore da expressão total = a + 2; LEDs nos GPIO 18, 23 e 24, botões 27, 17 e 22, feedback certo no GPIO 15 e errado no GPIO 14; Peterson com T0 na seção crítica, T1 em espera, wants[2], turn = 0 e sched_yield().</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131a"/><stop offset="1" stop-color="#102f3c"/></linearGradient>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#8fd3ff"/></marker>
  </defs>
  <rect width="400" height="1360" rx="20" fill="url(#bg)"/>
  <text x="20" y="42" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="22" font-weight="700">Laboratório</text>
  <g id="panel-parser" data-panel="parser">
    <rect class="panel-card" x="16" y="68" width="368" height="340" rx="16" fill="#0c1f29" stroke="#52717d" stroke-width="2"/>
    <text x="32" y="102" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="13" font-weight="700">01 · PARSING</text>
    <text x="32" y="139" fill="#8fd3ff" font-family="Arial,sans-serif" font-size="13">total = a + 2;</text>
    <path d="M200 193V222M200 222H100V248M200 222H300V248" fill="none" stroke="#8fd3ff" stroke-width="2" marker-end="url(#arrow)"/>
    <rect id="parser-root" x="108" y="159" width="184" height="40" rx="9" fill="#102a36" stroke="#8fd3ff" stroke-width="2"/>
    <text x="200" y="185" text-anchor="middle" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="13" font-weight="700">Atribuição</text>
    <rect id="parser-left" x="32" y="248" width="136" height="46" rx="9" fill="#102a36" stroke="#52717d" stroke-width="2"/>
    <text x="100" y="277" text-anchor="middle" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="13">total</text>
    <rect id="parser-sum" x="232" y="248" width="136" height="46" rx="9" fill="#102a36" stroke="#52717d" stroke-width="2"/>
    <text x="300" y="277" text-anchor="middle" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="13" font-weight="700">Soma</text>
    <path d="M300 294V316M300 316H242V342M300 316H358V342" fill="none" stroke="#8fd3ff" stroke-width="2" marker-end="url(#arrow)"/>
    <rect id="parser-a" x="214" y="316" width="56" height="28" rx="8" fill="#102a36" stroke="#52717d" stroke-width="2"/>
    <text x="242" y="368" text-anchor="middle" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="13">a</text>
    <rect id="parser-constant" x="330" y="316" width="56" height="28" rx="8" fill="#102a36" stroke="#52717d" stroke-width="2"/>
    <text x="358" y="368" text-anchor="middle" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="13">2</text>
    <text x="32" y="376" fill="#c2d3da" font-family="Arial,sans-serif" font-size="13">Árvore sintática</text>
  </g>
  <g id="panel-gpio" data-panel="gpio">
    <rect class="panel-card" x="16" y="428" width="368" height="414" rx="16" fill="#0c1f29" stroke="#52717d" stroke-width="2"/>
    <text x="32" y="462" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="13" font-weight="700">02 · JOGO GPIO</text>
    <text x="32" y="505" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="13">LEDs · GPIO 18 → 23 → 24</text>
    <path d="M55 538H345" stroke="#8fd3ff" stroke-width="2" marker-end="url(#arrow)"/>
    <g fill="#102a36" stroke="#52717d" stroke-width="2"><circle id="led-18" cx="66" cy="538" r="11"/><circle id="led-23" cx="200" cy="538" r="11"/><circle id="led-24" cx="334" cy="538" r="11"/></g>
    <text x="32" y="590" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="13">Botões · GPIO 27 · 17 · 22</text>
    <rect x="32" y="613" width="336" height="56" rx="10" fill="#102a36" stroke="#52717d" stroke-width="2"/>
    <text x="50" y="648" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="13">Entrada → resposta</text>
    <g fill="#102a36" stroke="#52717d" stroke-width="2"><circle id="button-27" cx="298" cy="641" r="8"/><circle id="button-17" cx="322" cy="641" r="8"/><circle id="button-22" cx="346" cy="641" r="8"/></g>
    <rect id="gpio-correct" x="32" y="690" width="336" height="54" rx="10" fill="#12372c" stroke="#7ee8c1" stroke-width="2"/>
    <text x="50" y="724" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="13" font-weight="700">Correto · GPIO 15</text>
    <rect id="gpio-incorrect" x="32" y="759" width="336" height="54" rx="10" fill="#3c2525" stroke="#ffaaa0" stroke-width="2"/>
    <text x="50" y="793" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="13" font-weight="700">Incorreto · GPIO 14</text>
  </g>
  <g id="panel-peterson" data-panel="peterson">
    <rect class="panel-card" x="16" y="862" width="368" height="438" rx="16" fill="#0c1f29" stroke="#52717d" stroke-width="2"/>
    <text x="32" y="896" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="13" font-weight="700">03 · PETERSON</text>
    <text x="32" y="934" fill="#8fd3ff" font-family="Arial,sans-serif" font-size="13">wants[0] = wants[1] = true</text>
    <text id="peterson-turn-zero" x="32" y="966" fill="#8fd3ff" font-family="Arial,sans-serif" font-size="13">turn = 0</text>
    <text id="peterson-turn-one" x="32" y="966" fill="#8fd3ff" font-family="Arial,sans-serif" font-size="13" opacity="0">turn = 1</text>
    <rect id="peterson-t0" x="32" y="990" width="336" height="86" rx="12" fill="#12372c" stroke="#7ee8c1" stroke-width="3"/>
    <text id="peterson-t0-active" x="50" y="1025" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="13" font-weight="700">T0 · seção crítica</text>
    <text id="peterson-t0-wait" x="50" y="1025" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="13" font-weight="700" opacity="0">T0 · espera</text>
    <text id="peterson-t0-critical-note" x="50" y="1053" fill="#c2d3da" font-family="Arial,sans-serif" font-size="13">única thread no recurso</text>
    <text id="peterson-t0-wait-note" x="50" y="1053" fill="#c2d3da" font-family="Arial,sans-serif" font-size="13" opacity="0">aguarda sua vez</text>
    <rect id="peterson-t1" x="32" y="1092" width="336" height="86" rx="12" fill="#102a36" stroke="#52717d" stroke-width="2"/>
    <text id="peterson-t1-wait" x="50" y="1127" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="13" font-weight="700">T1 · espera</text>
    <text id="peterson-t1-active" x="50" y="1127" fill="#f4f9fb" font-family="Arial,sans-serif" font-size="13" font-weight="700" opacity="0">T1 · seção crítica</text>
    <text id="peterson-yield" x="50" y="1155" fill="#c2d3da" font-family="Arial,sans-serif" font-size="13">thread em espera · sched_yield()</text>
    <text id="peterson-t1-active-note" x="50" y="1155" fill="#c2d3da" font-family="Arial,sans-serif" font-size="13" opacity="0">única thread no recurso</text>
    <text x="32" y="1224" fill="#c2d3da" font-family="Arial,sans-serif" font-size="13">Nunca duas threads na seção crítica.</text>
  </g>
