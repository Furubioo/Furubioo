<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Flávio Daniel — desenvolvimento e dados</title>
  <desc id="desc">Estudante de Ciência da Computação na UNICAP e técnico em Redes de Computadores. O foco visual destaca desenvolvimento de software e dados: a arquitetura Web do Sistema de Cinema e o pré-processamento de dados categóricos em um estudo acadêmico de score de crédito.</desc>
